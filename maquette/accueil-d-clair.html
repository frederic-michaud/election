<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D′ — Soirée électorale, fond clair · maquette Politiques.ch</title>
<style>
/* ═══ Variante D′ — « Soirée électorale », fond clair ══════════════════════
   La même page que D, au pixel près : trois panneaux de poids égal, chiffres
   énormes, horloge et barre d'avancement. Seule la palette change — page
   crème, panneaux blancs, et les couleurs validées sur fond clair (celles de
   charte.js), là où D avait dû les éclaircir pour tenir sur la nuit.
   Ce qu'on vérifie ici : est-ce que le « mur de résultats » tient sans le
   noir ? Le sombre donne la solennité de la soirée ; le clair donne la
   lisibilité de jour, l'impression papier, et une palette déjà validée.
   La barre de chaque objet est la barre finale des planches
   (barres-proposition.html) : la moustache pour l'intervalle de confiance de
   l'extrapolation, le rail teinté pour la majorité, le dépouillé en gris avec
   sa flèche seulement quand il est hors de l'intervalle, des mots discrets
   dessus et les chiffres dessous. L'intervalle n'existe pas encore dans le
   contrat de vue : ses marges sont inventées, voir MARGES plus bas.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  --fond: #fcfcfb; --panneau: #ffffff; --bord: #e1e0d9;
  --encre: #1f1f1c; --gris: #5f5e58;
  --oui: #2a78d6; --oui-clair: #86b6ef; --non: #c9352b; --neutre: #ecebe6;
  --fleche: #9d9c96; --discret: #8f8e88; --rouge-pale: #f1d5d2; --bleu-pale: #d3e2f6;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--fond); color: var(--encre); font: 16px/1.5 var(--sans); }
body { margin: 0 auto; max-width: 1280px; padding: 0 22px 44px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 18px;
  flex-wrap: wrap; padding: 20px 0 14px; }
.marque { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.2rem; letter-spacing: .01em; }
.marque .mot span { color: var(--oui); }
/* L'emblème du site refait en SVG (voir logo.py) : la Suisse, des barres qui en
   sortent, des points. En ligne pour suivre la palette. */
.logo { height: 48px; width: auto; display: block; }
.logo .pays { fill: var(--gris); opacity: .72; }
.logo .barres rect, .logo .points circle { fill: var(--oui); }
.contexte { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gris); }
.point { width: 9px; height: 9px; border-radius: 50%; background: var(--non);
  box-shadow: 0 0 0 0 rgba(201,53,43,.5); animation: pulse 2.2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(201,53,43,0); } 100% { box-shadow: 0 0 0 0 rgba(201,53,43,0); } }

.avancement { background: var(--panneau); border: 1px solid var(--bord); border-radius: 12px;
  padding: 16px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.avancement .l { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gris); }
.avancement .v { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; }
.avancement .rail { flex: 1 1 220px; min-width: 160px; height: 10px;
  background: var(--neutre); border-radius: 5px; overflow: hidden; }
.avancement .rail i { display: block; height: 100%; background: linear-gradient(90deg, var(--oui-clair), var(--oui)); }
.avancement .note { display: flex; align-items: center; gap: 9px; font-size: .84rem; color: var(--gris); }

.mur { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 18px; margin-top: 18px; }
.panneau { background: var(--panneau); border: 1px solid var(--bord); border-radius: 14px;
  padding: 22px 22px 8px; display: flex; flex-direction: column; }
.panneau .nom { font-size: .95rem; color: var(--gris); min-height: 3em; }
.panneau .chiffre { font-size: clamp(3.2rem, 7vw, 4.6rem); font-weight: 800;
  line-height: .95; letter-spacing: -.035em; margin: 10px 0 2px; }
.oui { color: var(--oui); } .non { color: var(--non); }
.etiquette { display: inline-block; font-size: .78rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 16px; }
.etiquette.oui { background: rgba(42,120,214,.12); }
.etiquette.non { background: rgba(201,53,43,.12); }
/* La barre finale (barres-proposition.html). De haut en bas : les mots, le trait
   et le rail, les chiffres. Le gris dit ce qu'on a compté, la couleur du verdict
   ce qu'on estime. */
.barre { position: relative; height: 62px; }
.barre .rail { position: absolute; left: 0; right: 0; top: 25px; height: 9px; border-radius: 5px;
  background: linear-gradient(90deg, var(--rouge-pale) 50%, var(--bleu-pale) 50%); }
.barre .moustache { position: absolute; top: 28px; height: 3px; background: var(--c); }
.barre .moustache::before, .barre .moustache::after { content: ""; position: absolute; top: -6px; width: 2px; height: 15px; background: var(--c); }
.barre .moustache::before { left: 0; } .barre .moustache::after { right: 0; }
.barre .connu { position: absolute; top: 17px; height: 25px; width: 2px; margin-left: -1px; background: var(--fleche); box-shadow: 0 0 0 1.5px #fff; }
.barre .trajet { position: absolute; top: 28.5px; height: 2px; background: var(--fleche); }
.barre .fleche { position: absolute; top: 25.5px; width: 0; height: 0; color: var(--fleche); border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
.barre .fleche.droite { margin-left: -7px; border-left: 7px solid; }
.barre .fleche.gauche { border-right: 7px solid; }
.barre em { position: absolute; transform: translateX(-50%); white-space: nowrap; font-style: normal; }
.barre .mot { top: 0; font-size: .68rem; line-height: 14px; color: var(--discret); letter-spacing: .01em; }
.barre .nb { top: 42px; font-size: .82rem; line-height: 18px; font-variant-numeric: tabular-nums; }
.barre .nb-connu { color: var(--gris); }
.barre .nb-proj { font-weight: 700; }
.barre .bord-g { transform: none; } .barre .bord-d { transform: translateX(-100%); }
.barre .vers-g { transform: translateX(-100%) !important; }
.barre .vers-d { transform: none !important; }
.barre [hidden] { display: none !important; }
.carte { margin-top: 12px; }
footer { color: var(--gris); font-size: .82rem; margin-top: 26px; text-align: center; }
footer a { color: var(--oui); }

/* Sur téléphone (600 px, le seuil du site) : l'emblème suffit, le nom disparaît ;
   la date reste à côté du logo, sur deux lignes, plutôt que de passer dessous. */
@media (max-width: 600px) {
  .marque .mot { display: none; }
  header { flex-wrap: nowrap; }
  .contexte { text-align: right; line-height: 1.5; }
  .contexte .quand { display: block; }
  /* Le bloc de dépouillement se fait petit : l'essentiel, ce sont les objets.
     Deux lignes — le direct, puis la jauge avec son pourcentage à droite — sans
     l'étiquette, que « Dépouillement en cours » rend redondante. */
  .avancement { padding: 12px 14px; gap: 8px 12px; }
  .avancement > div:first-child { display: contents; }
  .avancement .l { display: none; }
  .avancement .note { order: 1; flex-basis: 100%; font-size: .78rem; white-space: nowrap; }
  .avancement .rail { order: 2; flex: 1 1 0; min-width: 0; height: 8px; }
  .avancement .v { order: 3; font-size: 1.1rem; }
}
</style>
</head>

<footer>Projections extrapolées des communes dépouillées. Maquette — données fictives, intervalles de confiance illustratifs. <a href="#">La méthode</a></footer>

<script src="plotly.min.js"></script>
<script src="topojson-stub.js"></script>
<script src="charte.js"></script>
<script src="figures.js"></script>
<script src="verifier.js"></script>
<script>
if (!maquettePrete()) throw new Error("maquette incomplète — voir la bannière");
// Couleurs : celles de charte.js, la palette validée sur fond clair. Seuls
// les réglages de carte sont repris de D (petites cartes, sans barre).
const THEME = {
  surface: "#ffffff", encre1: "#1f1f1c", encre2: "#5f5e58",
  bleu: "#2a78d6", rouge: "#c9352b", neutre: "#f0efec",
  carte: { hauteur: 210, barreCouleur: false, demiEtendue: 18, contour: 0.15, opacite: 1 },
};
const pct = (v, d = 1) => (100 * v).toLocaleString("fr-CH", { minimumFractionDigits: d, maximumFractionDigits: d }) + " %";

// ── La barre finale ──────────────────────────────────────────────────────
// L'intervalle de confiance n'est pas dans le contrat de vue : ces marges
// (demi-largeur, en points) sont inventées — celles de la planche par défaut,
// ± 3 × 0,7, × 1, × 1,4 — en attendant que la voie Moteur en calcule une.
const MARGES = [2.1, 3, 4.2];
const ECART = 8;   // pixels minimum entre deux étiquettes voisines
const bord = (x) => x < 12 ? " bord-g" : x > 88 ? " bord-d" : "";

function barre(s, m) {
  const k = 100 * s.oui_connu, p = 100 * s.oui_extrapole, c = p >= 50 ? "var(--oui)" : "var(--non)";
  const lo = Math.max(0, p - m), hi = Math.min(100, p + m), cible = p >= k ? lo : hi;
  // Le dépouillé ne se dessine que s'il est hors de l'intervalle.
  const depouille = k >= lo && k <= hi ? "" :
    `<i class="trajet" style="left:${Math.min(k, cible)}%;width:${Math.abs(cible - k)}%"></i>
     <i class="fleche ${p >= k ? "droite" : "gauche"}" style="left:${cible}%"></i>
     <i class="connu" style="left:${k}%"></i>
     <em class="mot mot-connu${bord(k)}" style="left:${k}%">dépouillé</em>
     <em class="nb nb-connu${bord(k)}" style="left:${k}%">${pct(s.oui_connu)}</em>`;
  return `<div class="barre" data-k="${k}" data-p="${p}">
    <i class="rail"></i>
    <i class="moustache" style="left:${lo}%;width:${hi - lo}%;--c:${c}"></i>
    ${depouille}
    <em class="mot mot-proj${bord(p)}" style="left:${p}%;color:${c}">extrapolation</em>
    <em class="nb nb-proj${bord(p)}" style="left:${p}%;color:${c}">${pct(s.oui_extrapole)}</em>
  </div>`;
}

// Les étiquettes sont centrées sous et sur leur marque. Si elles se chevauchent,
// chacune s'aligne du côté opposé à l'autre ; si elles se touchent encore, le
// dépouillé perd son mot et son chiffre. Mesuré dans la page, à chaque largeur.
const rect = (e) => e.getBoundingClientRect();
const touche = (a, b) => { const A = rect(a), B = rect(b); return A.left < B.right + ECART && B.left < A.right + ECART; };
const deborde = (e, h) => { const r = rect(e), H = rect(h); return r.left < H.left - 1 || r.right > H.right + 1; };
function placer(h) {
  h.querySelectorAll("em").forEach((e) => { e.hidden = false; e.classList.remove("vers-g", "vers-d"); });
  const kc = h.querySelector(".nb-connu");
  if (!kc) return;
  const pc = h.querySelector(".nb-proj"), pm = h.querySelector(".mot-proj"), km = h.querySelector(".mot-connu");
  if (!touche(pc, kc) && !touche(pm, km)) return;
  const kGauche = parseFloat(h.dataset.k) < parseFloat(h.dataset.p);
  const ext = kGauche ? "vers-d" : "vers-g", dep = kGauche ? "vers-g" : "vers-d";
  [[pc, ext], [pm, ext], [kc, dep], [km, dep]].forEach(([e, cote]) => e.classList.add(cote));
  if (touche(pc, kc) || touche(pm, km) || [pc, kc, pm, km].some((e) => deborde(e, h))) {
    h.querySelectorAll("em").forEach((e) => e.classList.remove("vers-g", "vers-d"));
    kc.hidden = true; km.hidden = true;
  }
}
const placerTout = () => document.querySelectorAll(".barre").forEach(placer);

document.getElementById("date").textContent =
  new Date(VUE.date).toLocaleDateString("fr-CH", { day: "numeric", month: "long", year: "numeric" });
document.getElementById("heure").textContent =
  new Date().toLocaleTimeString("fr-CH", { hour: "2-digit", minute: "2-digit" });
document.getElementById("avance").textContent = pct(VUE.avance);
document.getElementById("jauge").style.width = (100 * VUE.avance) + "%";

document.getElementById("mur").innerHTML = VUE.sujets.map((s, i) => {
  const g = s.oui_extrapole >= 0.5;
  return `<article class="panneau">
    <div class="nom">${s.nom}</div>
    <div class="chiffre ${g ? "oui" : "non"}">${pct(s.oui_extrapole)}</div>
    <div><span class="etiquette ${g ? "oui" : "non"}">${g ? "accepté" : "refusé"}</span></div>
    ${barre(s, MARGES[i] ?? 3)}
    <div class="carte" id="carte-${i}"></div>
  </article>`;
}).join("");

placerTout();
// Le mur change de largeur avec la fenêtre, et quand la barre de défilement apparaît.
let attente;
new ResizeObserver(() => { cancelAnimationFrame(attente); attente = requestAnimationFrame(placerTout); })
  .observe(document.getElementById("mur"));

VUE.sujets.forEach((s, i) => tracer("carte-" + i, FIGURES.cartes_svg[s.id], "carte_svg", THEME));
</script>
</body>
</html>
