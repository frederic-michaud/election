name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  qualite:
    name: Lint et tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q
